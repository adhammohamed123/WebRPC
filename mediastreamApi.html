<!DOCTYPE html>

<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8" />
    <title>MediaStreamAPI</title>
</head>
<body>
    <video autoplay></video>
    <button onclick="Start()">start</button>
    <div>
        <button onclick="btnGetAudioTracks()">
            getAudioTracks()
        </button>
    </div>
    <div>
        <button onclick="btnGetTrackById()">
            getTrackById()
        </button>
    </div>
    <div>
        <button onclick="btnGetTracks()">
            getTracks()
        </button>
    </div>
    <div>
        <button onclick="btnGetVideoTracks()">
            getVideoTracks()
        </button>
    </div>
    <div>
        <button onclick="btnRemoveAudioTrack()">
            removeTrack() - audio
        </button>
    </div>
    <div>
        <button onclick="btnRemoveVideoTrack()">
            removeTrack() - video
        </button>
    </div>
    <script>
        // Check if the browser supports WebRTC
        function hasUserMedia() {
            return !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia);
        }

        function Start() {
            if (hasUserMedia()) {
                navigator.mediaDevices
                    .getUserMedia({ video: true, audio: true } , stream)
                    .then(function (stream) {
                        var video = document.querySelector("video");
                        video.srcObject = stream;
                    })
                    .catch(function (err) {
                        console.error("Error accessing media devices.", err);
                    });
            } else {
                alert("Error. WebRTC is not supported!");
            }

            function getAudioTracks () {
                console.log("getAudioTracks");
                console.log(stream.getAudioTracks());
            }

            function getTrackById () {
                console.log("getTrackById");
                console.log(stream.getTrackById(stream.getAudioTracks()[0].id));
            }

            function getTracks () {
                console.log("getTracks");
                console.log(stream.getTracks());
            }

            function getVideoTracks() {
                console.log("getVideoTracks");
                console.log(stream.getVideoTracks());
            }

            function removeAudioTrack() {
                console.log("removeAudioTrack");
                stream.removeTrack(stream.getAudioTracks()[0]);
            }

            function removeVideoTrack() {
                console.log("removeVideoTrack");
                stream.removeTrack(stream.getVideoTracks()[0]);
            }
        }

    </script>
</body>
</html>
